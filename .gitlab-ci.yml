workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - validate
  - package

default:
  before_script:
    - mkdir -p ci_artifacts
    - printf "GREASPY job started at %s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci_artifacts/validation-summary.txt
    - python --version

validate:
  stage: validate
  script:
    - printf "GREASPY validation started at %s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> ci_artifacts/validation-summary.txt
    - python -m compileall -q tools ci
    - python ci/validate_greaspy.py
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ci_artifacts/

package_release:
  stage: package
  needs:
    - validate
  script:
    - python ci/package_release.py
  artifacts:
    name: "greaspy-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - dist/greaspy-release.zip
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
