workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - validate
  - package

default:
  image: python:3.12-slim
  cache:
    key: "pip-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip/
  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

validate:
  stage: validate
  script:
    - mkdir -p ci_artifacts
    - printf "GREASPY validation started at %s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci_artifacts/validation-summary.txt
    - python -m compileall -q tools ci
    - python ci/validate_greaspy.py
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ci_artifacts/

package_release:
  stage: package
  needs:
    - validate
  script:
    - python ci/package_release.py
  artifacts:
    name: "greaspy-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - dist/greaspy-release.zip
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
